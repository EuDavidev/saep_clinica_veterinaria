<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gerenciar agendamentos | Clinica veterinaria</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header><strong id="nome-usuario"></strong>
    <nav aria-label="Navegacao principal">
      <a href="/">Inicio</a><a href="/tutores">Tutores</a>
      <a href="/pets">Pets</a><a href="/agendamentos">Agendamentos</a>
    </nav><button id="botao-sair" type="button">Sair</button>
  </header>
  <p id="mensagem" role="status" aria-live="polite"></p>
  <main id="conteudo" hidden>
    <h1>Gerenciar agendamentos</h1>

    <h2 id="titulo-formulario">Novo cadastro</h2>
    <p>Use Editar para alterar a data e salvar o reagendamento.</p>
    <form id="formulario">
      <input type="hidden" name="id">

      <label>Pet e tutor<select id="pet" name="pet_id" required></select></label>
      <label>Data e hora<input name="data_hora" type="datetime-local"
        step="60" required></label>
      <label>Procedimento<input name="procedimento" maxlength="100" required></label>
      <label>Valor em reais<input name="valor" type="number" min="0"
        max="99999999.99" step="0.01" required></label>
      <div><button id="botao-salvar" type="submit">Salvar</button>
        <button id="botao-cancelar" type="button">Limpar / cancelar edicao</button></div>
    </form>

    <h2>Registros cadastrados</h2>
    <div class="tabela-rolavel"><table>
      <thead><tr><th scope="col">Data e hora</th><th scope="col">Procedimento</th><th scope="col">Valor</th><th scope="col">Dados do pet</th><th scope="col">Dados do tutor</th>
        <th scope="col">Acao</th></tr></thead>
      <tbody id="tabela"></tbody>
    </table></div>
  </main>
  <script type="module" src="/js/agendamentos.js"></script>
</body>
</html>
