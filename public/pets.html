<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gerenciar pets | Clinica veterinaria</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header><strong id="nome-usuario"></strong>
    <nav aria-label="Navegacao principal">
      <a href="/">Inicio</a><a href="/tutores">Tutores</a>
      <a href="/pets">Pets</a><a href="/agendamentos">Agendamentos</a>
    </nav><button id="botao-sair" type="button">Sair</button>
  </header>
  <p id="mensagem" role="status" aria-live="polite"></p>
  <main id="conteudo" hidden>
    <h1>Gerenciar pets</h1>

    <h2 id="titulo-formulario">Novo cadastro</h2>
    <p>Cadastre o tutor antes do pet. Na edicao, mantenha o tutor original.</p>
    <form id="formulario">
      <input type="hidden" name="id">

      <label>Nome<input name="nome" maxlength="100" required></label>
      <label>Especie<input name="especie" maxlength="50" required></label>
      <label>Raca<input name="raca" maxlength="80" required></label>
      <label>Idade em anos<input name="idade" type="number" min="0" max="99"
        step="1" required></label>
      <label>Tutor<select id="tutor" name="tutor_id" required></select></label>
      <div><button id="botao-salvar" type="submit">Salvar</button>
        <button id="botao-cancelar" type="button">Limpar / cancelar edicao</button></div>
    </form>

    <form id="formulario-busca" class="busca">
      <label>Buscar por nome ou e-mail/tutor
        <input id="campo-busca" maxlength="150"></label>
      <button type="submit">Buscar</button>
    </form>
    <h2>Registros cadastrados</h2>
    <div class="tabela-rolavel"><table>
      <thead><tr><th scope="col">Nome</th><th scope="col">Especie</th><th scope="col">Raca</th><th scope="col">Idade</th><th scope="col">Tutor</th>
        <th scope="col">Acao</th></tr></thead>
      <tbody id="tabela"></tbody>
    </table></div>
  </main>
  <script type="module" src="/js/pets.js"></script>
</body>
</html>
