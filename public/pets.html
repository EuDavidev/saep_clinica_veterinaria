<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Principal · SAEP</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/principal.css">
</head>
<body>

  <header>
    <strong id="nome-usuario"></strong>
    <nav aria-label="Navegação principal">
      <a href="/">Início</a>
      <a href="/produtos">Produtos</a>
      <a href="/estoque">Estoque</a>
    </nav>
    <button id="botao-sair" type="button">Sair</button>
  </header>
  <p id="mensagem" role="status" aria-live="polite"></p>
  <main id="conteudo" hidden>
    <h1>Controle de estoque</h1>
    <p>Escolha o que você deseja fazer.</p>
    <section class="atalhos" aria-label="Áreas do sistema">
      <a class="atalho" href="/produtos"><h2>Produtos</h2><p>Cadastrar, buscar, editar e excluir.</p></a>
      <a class="atalho" href="/estoque"><h2>Estoque</h2><p>Registrar entradas, saídas e consultar o histórico.</p></a>
    </section>
  </main>
  <script type="module" src="/js/principal.js"></script>
</body>
</html>
