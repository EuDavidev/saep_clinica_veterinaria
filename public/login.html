<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar no sistema | Clinica veterinaria</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <p id="mensagem" role="status" aria-live="polite"></p>
  <main id="conteudo">
    <h1>Entrar no sistema</h1>

    <form id="formulario-login">
      <label>E-mail<input name="email" type="email" maxlength="150"
        autocomplete="username" required></label>
      <label>Senha<input name="senha" type="password" maxlength="200"
        autocomplete="current-password" required></label>
      <button id="botao-entrar" type="submit">Entrar</button>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
